<h1>⚙️ Настройки</h1>

<section class="card">
  <label class="toggle"><input type="checkbox" checked /> Тёмная тема</label>
  <label class="toggle"><input type="checkbox" /> Уведомления</label>
  <label class="toggle"><input type="checkbox" checked /> Автосохранение</label>
</section>

<div class="actions">
  <a class="btn" routerLink="profile">Открыть профиль</a>
  <button class="btn btn-secondary" type="button" (click)="openResetConfirm()">
    Сбросить настройки
  </button>
  <button class="btn btn-secondary" type="button" (click)="togglePlan()">
    Сменить план ({{ plan() }})
  </button>
</div>

<router-outlet [routerOutletData]="{ plan: plan() }" />
